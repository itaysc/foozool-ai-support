[build]
builder = "nixpacks"

[deploy]
startCommand = "npm run serve"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "nodejs-api"
sourceDir = "server"

[[services]]
name = "python-ml"
sourceDir = "python-ml-service"