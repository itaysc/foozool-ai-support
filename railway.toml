[deploy]
healthcheckTimeout = 3000
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "nodejs-api"
sourceDir = "."
dockerfilePath = "server/Dockerfile"
healthcheckPath = "/api/v1/health/database"
watchPatterns = ["server/**/*", "common/**/*"]

[[services]]
name = "python-ml"
sourceDir = "python-ml-service"
dockerfilePath = "python-ml-service/Dockerfile"
healthcheckPath = "/health"
watchPatterns = ["python-ml-service/**/*"]