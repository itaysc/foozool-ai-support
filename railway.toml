[build]
builder = "nixpacks"

[deploy]
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "nodejs-api"
sourceDir = "server"
healthcheckPath = "/api/v1/health/database"
watchPatterns = ["server/**/*"]

[[services]]
name = "python-ml"
sourceDir = "python-ml-service"
healthcheckPath = "/health"
watchPatterns = ["python-ml-service/**/*"]