[build]
builder = "dockerfile"
dockerfilePath = "python-ml-service/Dockerfile"

[deploy]
startCommand = "python startup.py"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Configure persistent storage for models
[[services]]
name = "python-ml-service"
source = "."

[services.variables]
ENVIRONMENT = "production"
RAILWAY_ENVIRONMENT = "production"

# Mount persistent storage for models
[services.volumes]
"/data" = "models-storage"

[[services]]
name = "nodejs-api"
sourceDir = "."
dockerfilePath = "server/Dockerfile"
healthcheckPath = "/api/v1/health/database"
watchPatterns = ["server/**/*", "common/**/*"]