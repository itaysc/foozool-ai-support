# Python ML Service Configuration
[[services]]
name = "python-ml-service"

[services.build]
builder = "dockerfile"

[services.deploy]
startCommand = "python startup.py"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
memory = "2GB"

[services.variables]
ENVIRONMENT = "production"
RAILWAY_ENVIRONMENT = "production"
PYTHONUNBUFFERED = "1"

# Mount persistent storage for models
[services.volumes]
"/data" = "models-storage"

# Node.js API Service Configuration
[[services]]
name = "nodejs-api"

[services.build]
builder = "dockerfile"

[services.deploy]
healthcheckPath = "/api/v1/health/database"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
memory = "1GB"

[services.variables]
ENVIRONMENT = "production"
RAILWAY_ENVIRONMENT = "production"