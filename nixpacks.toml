[phases.setup]
nixPkgs = ["nodejs", "yarn"]

[phases.install]
cmds = ["cd server && yarn install --frozen-lockfile"]

[phases.build]
cmds = [
    "cd server && yarn build",
    "cd server && chmod +x setup-env.sh",
    "cd server && ./setup-env.sh",
    "cd server && cp prod.env .env || echo 'prod.env not found, will use system env vars'"
]

[start]
cmd = "cd server && yarn start"
